<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Morning Fun Station 🎉</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      padding: 30px 10px;
      font-size: 2.8rem;
      margin: 0;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 0 10px 20px;
      justify-content: center;
    }
    .game {
      flex: 1;
      min-width: 300px;
      max-width: 700px;
      background: rgba(255,255,255,0.1);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .game h2 {
      margin: 0;
      padding: 12px;
      text-align: center;
      background: rgba(0,0,0,0.3);
      font-size: 1.5rem;
    }
    iframe {
      width: 100%;
      height: 700px;
      border: none;
      display: block;
    }
    @media (max-width: 800px) {
      h1 { font-size: 2.2rem; }
      iframe { height: 600px; }
    }
  </style>
</head>
<body>

  <h1>Morning Fun Station 🎯✨</h1>

  <div class="container">
    
    <!-- Akinator -->
    <div class="game">
      <h2>🧞‍♂️ Akinator – Can He Guess Your Character?</h2>
      <iframe src="https://www.20q.net/embed" width="100%" height="500"></iframe>
      </div>
    
    <!-- Wheel of Names -->
    <div class="game">
      <h2>🎡 Wheel of Names – Who’s Next?</h2>
      <iframe src="https://wheelofnames.com/" allowfullscreen></iframe>
    </div>
    
  </div>

</body>
</html>
